name: Qphox
description: >-
  QphoX is a Delft, Netherlands-based quantum technology company founded in 2021 and spun out of
  Delft University of Technology (TU Delft). It develops quantum networking hardware to tackle the
  scaling challenges of quantum computing, centered on its Quantum Transducer, described as the
  first quantum interface between single optical and single microwave photons, enabling optical
  interconnects between superconducting quantum processors. Alongside the transducer, QphoX offers
  an Optical Control System for delivering RF signals into extreme cryogenic environments and a
  CryoSwitch Control Module for use with Radiall's cryogenic latching actuator. The company
  publishes open-source Python instrument-control libraries (QCoDeS drivers) on GitHub for operating
  its hardware. QphoX is backed by Speedinvest. QphoX exposes no public web API or developer portal.
